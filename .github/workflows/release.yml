name: Release Wheels

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: -1
        fetch-tags: true
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.15
        cache: pip
    - run: pip wheel --no-deps .
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheel
        path: ./rls*.whl

  upload_wheel_test:
    needs: [build_wheel]
    runs-on: ubuntu-latest
    if: github.repository_owner == 'DelfinaCare' && github.ref == 'refs/heads/main'
    environment:
        name: pypi-test
        url: https://test.pypi.org/p/rls
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
            name: wheel
            path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
            repository-url: https://test.pypi.org/legacy/

  upload_wheel:
    needs: [build_wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && github.repository_owner == 'DelfinaCare'
    environment:
        name: pypi
        url: https://pypi.org/p/rls
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
            name: wheel
            path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
